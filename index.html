const initials = n => n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
document.getElementById('navlinks').innerHTML = STUDENTS.map(function(s,i){
 return s.ready
  ? '<button class="navbtn rounded-lg px-3 py-1.5 text-sm font-semibold text-white/70 transition hover:bg-white/10 hover:text-white" data-i="'+i+'" onclick="showStudent('+i+')">'+s.name.split(' ')[0]+'</button>'
  : '<span class="rounded-lg px-3 py-1.5 text-sm font-semibold text-white/30" title="Site coming soon">'+s.name.split(' ')[0]+'</span>';
}).join('');
document.getElementById('mobilemenu').innerHTML =
 '<button onclick="showHome();closeMenu()" class="block w-full px-6 py-3 text-left font-semibold text-white/80 hover:bg-white/10">Showcase home</button>'
 + STUDENTS.map(function(s,i){
   return s.ready
    ? '<button onclick="showStudent('+i+');closeMenu()" class="block w-full border-t border-white/5 px-6 py-3 text-left font-semibold text-white/80 hover:bg-white/10">'+s.name+'</button>'
    : '<span class="block w-full border-t border-white/5 px-6 py-3 text-left font-semibold text-white/30">'+s.name+' — coming soon</span>';
 }).join('');
document.getElementById('cards').innerHTML = STUDENTS.map(function(s,i){
 var action = s.ready ? 'onclick="showStudent('+i+')"' : '';
 var badge = s.ready ? '<span class="text-sm font-bold" style="color:'+s.accent+'">View site &rarr;</span>' : '<span class="text-sm font-semibold text-slate-400">Coming soon</span>';
 return '<div class="card group '+(s.ready?'cursor-pointer':'')+' overflow-hidden rounded-2xl bg-white/5 ring-1 ring-white/10 transition hover:-translate-y-0.5 hover:ring-white/25" '+action+'>'
 +'<div class="h-1.5" style="background:'+s.accent+'"></div>'
 +'<div class="flex items-center gap-4 p-5">'
 +(s.photo?'<img class="h-16 w-16 shrink-0 rounded-full object-cover ring-2 ring-white/20" src="'+s.photo+'" alt="'+s.name+'">':'<div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full text-lg font-bold text-white" style="background:'+s.brand+'">'+initials(s.name)+'</div>')
 +'<div class="min-w-0 flex-1"><h2 class="text-lg font-bold">'+s.name+'</h2><p class="truncate text-sm text-white/60">'+s.tag+'</p></div></div>'
 +'<div class="px-5 pb-4">'+badge+'</div></div>';
}).join('');
function toggleMenu(){document.getElementById('mobilemenu').classList.toggle('hidden');}
function closeMenu(){document.getElementById('mobilemenu').classList.add('hidden');}
var backbtn=document.getElementById('backbtn');
function showStudent(i){var s=STUDENTS[i];document.getElementById('frame').src=s.url;document.getElementById('hub').classList.add('hidden');document.getElementById('viewer').classList.remove('hidden');document.getElementById('viewer').classList.add('flex');backbtn.classList.remove('hidden');backbtn.classList.add('flex');document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',+b.dataset.i===i));}
function showHome(){document.getElementById('viewer').classList.add('hidden');document.getElementById('viewer').classList.remove('flex');document.getElementById('hub').classList.remove('hidden');backbtn.classList.add('hidden');backbtn.classList.remove('flex');document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));}
</script></body></html>
