<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Summer Youth Web Program 2026 — City of Carson</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Sora','sans-serif']}}}}</script>
<style>
  html,body{height:100%}
  #frame{width:100%;height:100%;border:0;background:#fff}
  .navbtn.active{background:rgba(255,255,255,.15);color:#fff}
  @media print{
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    #viewer,#mobilemenu,#hamburger,#backbtn{display:none!important}#hub{display:block!important}
    #navlinks{display:flex!important}
    body{background:#fff!important;color:#0f172a!important;height:auto!important}
    nav{position:static!important;background:#fff!important;border-color:#e2e8f0!important}
    nav button,nav span{color:#0f172a!important}
    #hero-title{color:#0f172a!important}#hero-sub{color:#475569!important}
    .photo-box{border-color:#cbd5e1!important;background:#f1f5f9!important;color:#94a3b8!important}
    .card{background:#fff!important;border:1px solid #e2e8f0!important;box-shadow:none!important;break-inside:avoid}
    .card h2{color:#0f172a!important}.card p{color:#475569!important}
  }
</style></head>
<body class="flex h-full flex-col bg-slate-900 font-sans text-white">
<nav class="z-40 shrink-0 border-b border-white/10 bg-slate-900/95 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center px-4 py-2.5">
    <button id="backbtn" onclick="showHome()" class="mr-3 hidden items-center gap-1.5 rounded-lg bg-amber-400 px-3 py-1.5 text-sm font-bold text-slate-900 transition hover:bg-amber-300">&larr; Showcase home</button>
    <button onclick="showHome()" class="font-extrabold tracking-tight">Carson&nbsp;<span class="text-amber-400">Youth&nbsp;Web</span></button>
    <div id="navlinks" class="ml-auto hidden flex-wrap items-center gap-1 md:flex"></div>
    <button id="hamburger" onclick="toggleMenu()" aria-label="Menu" class="ml-auto rounded-lg p-2 text-white/80 transition hover:bg-white/10 md:hidden">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </div>
  <div id="mobilemenu" class="hidden border-t border-white/10 md:hidden"></div>
</nav>
<div id="hub" class="flex-1 overflow-auto">
  <header class="mx-auto max-w-5xl px-6 pt-10 pb-8 text-center">
    <div class="photo-box mx-auto mb-7 flex h-52 w-full max-w-3xl items-center justify-center rounded-2xl border-2 border-dashed border-white/20 bg-white/5 text-white/40">Group photo</div>
    <p class="text-xs font-bold uppercase tracking-[0.35em] text-amber-400">City of Carson</p>
    <h1 id="hero-title" class="mt-2 text-4xl font-extrabold sm:text-5xl">Summer Youth Web Program <span class="text-amber-400">2026</span></h1>
    <p id="hero-sub" class="mx-auto mt-3 max-w-xl text-lg text-white/70">Six students. Real websites, built from scratch. Tap anyone below or in the menu — their site opens right here, and you never leave the showcase.</p>
  </header>
  <main class="mx-auto max-w-5xl px-6 pb-16"><div id="cards" class="grid gap-4 sm:grid-cols-2"></div></main>
</div>
<div id="viewer" class="hidden flex-1 flex-col"><iframe id="frame" title="student site"></iframe></div>
<script>
const STUDENTS = [{"name": "Maximus Roman", "brand": "#134E4A", "accent": "#0D9488", "tag": "Aspiring game developer, obsessed with programming.", "url": "https://mxrom08.github.io/resume-site/template/index.html", "ready": true}, {"name": "Marquise McGee", "brand": "#0C2559", "accent": "#2C62CC", "tag": "Computer Science student, focused on networking.", "url": "https://quise27.github.io/resume-site/template/index.html", "ready": true}, {"name": "Ayden Fronda", "brand": "#7C2D12", "accent": "#EA580C", "tag": "Basketball, and I love working with kids.", "url": "https://ayden12710.github.io/resume-site/template/layouts/fun.html", "ready": true}, {"name": "John Lim", "brand": "#4C1D95", "accent": "#7C3AED", "tag": "Building my corner of the internet.", "url": "https://jtl4hunnid.github.io/resume-site/template/indexbunz.html", "ready": true}, {"name": "Valerie Lopez", "brand": "#831843", "accent": "#DB2777", "tag": "14, and this is my first year building websites.", "url": "https://vvaleriee-lopez.github.io/resume-site/template/index.html", "ready": true}, {"name": "Laurice Hizon", "brand": "#0C4A6E", "accent": "#0284C7", "tag": "Sophomore and Summer Youth Worker at Carson.", "url": "https://angelsagonize.github.io/resume-site/template/index.html", "ready": true}];
const initials = n => n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
document.getElementById('navlinks').innerHTML = STUDENTS.map(function(s,i){
 return s.ready
  ? '<button class="navbtn rounded-lg px-3 py-1.5 text-sm font-semibold text-white/70 transition hover:bg-white/10 hover:text-white" data-i="'+i+'" onclick="showStudent('+i+')">'+s.name.split(' ')[0]+'</button>'
  : '<span class="rounded-lg px-3 py-1.5 text-sm font-semibold text-white/30" title="Site coming soon">'+s.name.split(' ')[0]+'</span>';
}).join('');
document.getElementById('mobilemenu').innerHTML =
 '<button onclick="showHome();closeMenu()" class="block w-full px-6 py-3 text-left font-semibold text-white/80 hover:bg-white/10">Showcase home</button>'
 + STUDENTS.map(function(s,i){
   return s.ready
    ? '<button onclick="showStudent('+i+');closeMenu()" class="block w-full border-t border-white/5 px-6 py-3 text-left font-semibold text-white/80 hover:bg-white/10">'+s.name+'</button>'
    : '<span class="block w-full border-t border-white/5 px-6 py-3 text-left font-semibold text-white/30">'+s.name+' — coming soon</span>';
 }).join('');
document.getElementById('cards').innerHTML = STUDENTS.map(function(s,i){
 var action = s.ready ? 'onclick="showStudent('+i+')"' : '';
 var badge = s.ready ? '<span class="text-sm font-bold" style="color:'+s.accent+'">View site &rarr;</span>' : '<span class="text-sm font-semibold text-slate-400">Coming soon</span>';
 return '<div class="card group '+(s.ready?'cursor-pointer':'')+' overflow-hidden rounded-2xl bg-white/5 ring-1 ring-white/10 transition hover:-translate-y-0.5 hover:ring-white/25" '+action+'>'
 +'<div class="h-1.5" style="background:'+s.accent+'"></div>'
 +'<div class="flex items-center gap-4 p-5">'
 +'<div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full text-lg font-bold text-white" style="background:'+s.brand+'">'+initials(s.name)+'</div>'
 +'<div class="min-w-0 flex-1"><h2 class="text-lg font-bold">'+s.name+'</h2><p class="truncate text-sm text-white/60">'+s.tag+'</p></div></div>'
 +'<div class="px-5 pb-4">'+badge+'</div></div>';
}).join('');
function toggleMenu(){document.getElementById('mobilemenu').classList.toggle('hidden');}
function closeMenu(){document.getElementById('mobilemenu').classList.add('hidden');}
var backbtn=document.getElementById('backbtn');
function showStudent(i){var s=STUDENTS[i];document.getElementById('frame').src=s.url;document.getElementById('hub').classList.add('hidden');document.getElementById('viewer').classList.remove('hidden');document.getElementById('viewer').classList.add('flex');backbtn.classList.remove('hidden');backbtn.classList.add('flex');document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',+b.dataset.i===i));}
function showHome(){document.getElementById('viewer').classList.add('hidden');document.getElementById('viewer').classList.remove('flex');document.getElementById('hub').classList.remove('hidden');backbtn.classList.add('hidden');backbtn.classList.remove('flex');document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));}
</script></body></html>
